events {}

http {
    upstream cloudapp {
        server app:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://cloudapp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health and metrics endpoints are proxied too, but in a real
        # deployment you'd typically firewall /metrics off from public
        # access at this exact layer — Nginx is where that decision belongs.
        location /healthz {
            proxy_pass http://cloudapp;
        }
    }
}
